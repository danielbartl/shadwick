<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div class="sw-empty" data-border>
        <div class="sw-empty-header">
            <div wicket:id="media" class="sw-empty-media" data-variant="icon"><svg wicket:id="icon"></svg></div>
            <h3 wicket:id="title" class="sw-empty-title"></h3>
            <p wicket:id="message" class="sw-empty-description"></p>
        </div>
        <div class="sw-empty-content"><div wicket:id="content"></div></div>
    </div>
</wicket:panel>
