<wicket:panel xmlns:wicket="http://wicket.apache.org"><div wicket:id="container" class="sw-field">
<label wicket:id="label" class="sw-label sw-field-label"></label>
<div wicket:id="picker" class="sw-date-picker">
<button wicket:id="trigger" class="sw-button sw-date-picker-trigger" data-variant="outline" type="button" aria-haspopup="dialog" aria-expanded="false"><svg wicket:id="icon"></svg><span wicket:id="value" class="sw-date-picker-value"></span></button>
<div wicket:id="popup" class="sw-popover-content sw-date-picker-content" popover="auto" data-side="bottom" data-align="start" role="dialog" tabindex="-1">
<div wicket:id="calendar"><input wicket:id="input" class="sw-input sw-calendar-input" type="date"></div></div></div>
<p wicket:id="description" class="sw-field-description"></p><div wicket:id="error" class="sw-field-error" role="status"></div>
</div></wicket:panel>
