<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div wicket:id="container" class="sw-field" data-orientation="horizontal">
        <span class="sw-checkbox-wrapper">
            <input wicket:id="input" type="checkbox" class="sw-checkbox" />
            <!-- Lucide check/minus (ISC, see NOTICE). The browser's :checked/:indeterminate picks the indicator. -->
            <svg class="sw-checkbox-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m20 6-11 11-5-5"/></svg>
            <svg class="sw-checkbox-indeterminate-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/></svg>
        </span>
        <label wicket:id="label" class="sw-label sw-field-label"></label>
        <p wicket:id="description" class="sw-field-description"></p>
        <div wicket:id="error" class="sw-field-error" role="status"></div>
    </div>
</wicket:panel>
