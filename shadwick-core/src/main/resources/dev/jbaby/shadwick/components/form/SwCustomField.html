<wicket:panel xmlns:wicket="http://wicket.apache.org">
  <fieldset wicket:id="container" class="sw-field sw-field-set sw-custom-field">
    <legend wicket:id="label" class="sw-field-label sw-field-legend" data-variant="label"></legend>
    <div wicket:id="input"></div>
    <p wicket:id="description" class="sw-field-description"></p>
    <div wicket:id="error" class="sw-field-error" role="status"></div>
  </fieldset>
</wicket:panel>
