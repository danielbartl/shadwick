<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
    <div wicket:id="container" class="sw-field">
        <label wicket:id="label" class="sw-label sw-field-label"></label>
        <input wicket:id="input" class="sw-input" />
        <p wicket:id="description" class="sw-field-description"></p>
        <div wicket:id="error" class="sw-field-error" role="status"></div>
    </div>
</wicket:panel>
</body>
</html>
