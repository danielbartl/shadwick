<wicket:panel xmlns:wicket="http://wicket.apache.org">
  <div wicket:id="media" class="sw-attachment-media"><wicket:container wicket:id="defaultMedia"><svg wicket:id="icon" class="sw-attachment-fallback"></svg><img wicket:id="image" class="sw-attachment-image" alt=""></wicket:container><wicket:container wicket:id="mediaContent"></wicket:container></div>
  <div wicket:id="content" class="sw-attachment-content"><span wicket:id="title" class="sw-attachment-title"></span><span wicket:id="description" class="sw-attachment-description"></span></div>
  <div wicket:id="actionArea" class="sw-attachment-actions"><wicket:container wicket:id="actions"></wicket:container></div>
  <a wicket:id="trigger"></a>
</wicket:panel>
