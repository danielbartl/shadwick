<wicket:panel xmlns:wicket="http://wicket.apache.org">
  <div wicket:id="list" class="sw-load-more-list" role="list">
    <div wicket:id="batch" class="sw-load-more-batch" role="none"><div wicket:id="item" role="listitem"></div></div>
  </div>
  <div wicket:id="footer" class="sw-load-more">
    <a wicket:id="more" class="sw-load-more-button"></a>
    <span wicket:id="count" class="sw-load-more-count"></span>
  </div>
  <p wicket:id="status" class="sw-load-more-status" role="status"></p>
</wicket:panel>
