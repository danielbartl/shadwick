<html wicket:id="html" xmlns:wicket="http://wicket.apache.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title wicket:id="appTitle">Application</title>
</head>
<body>
<a wicket:id="skip"></a>
<div wicket:id="provider">
  <nav wicket:id="sidebar"></nav>
  <div wicket:id="workspace">

      <button wicket:id="trigger" type="button"></button>

    <main wicket:id="main"><wicket:child/></main>
  </div>
</div>

</html>
