<wicket:panel xmlns:wicket="http://wicket.apache.org">
  <div wicket:id="steps" class="sw-wizard-steps"></div>
  <form wicket:id="form" class="sw-wizard-form">
    <div wicket:id="errors"></div>
    <div wicket:id="group" class="sw-wizard-step" role="group" tabindex="-1"><div wicket:id="step"></div></div>
    <div class="sw-wizard-footer">
      <button wicket:id="back" type="submit" class="sw-wizard-back"></button>
      <button wicket:id="next" type="submit" class="sw-wizard-next"></button>
      <button wicket:id="finish" type="submit" class="sw-wizard-finish"></button>
    </div>
  </form>
</wicket:panel>
