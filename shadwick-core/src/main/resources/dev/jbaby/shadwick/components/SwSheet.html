<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <button wicket:id="trigger" type="button" command="show-modal"><span wicket:id="triggerLabel"></span></button>
    <dialog wicket:id="dialog" class="sw-sheet">
        <form wicket:id="form" class="sw-dialog-form sw-sheet-form">
            <div class="sw-sheet-header">
                <div wicket:id="title" class="sw-sheet-title" role="heading" aria-level="2"></div>
                <p wicket:id="description" class="sw-sheet-description"></p>
            </div>
            <div class="sw-sheet-body"><div wicket:id="content" class="sw-sheet-body-content"></div></div>
            <div wicket:id="footer" class="sw-dialog-footer sw-sheet-footer">
                <button wicket:id="cancel" type="button" command="close"><span wicket:id="cancelLabel"></span></button>
                <button wicket:id="confirm" type="submit"><span wicket:id="confirmLabel"></span></button>
            </div>
            <!-- Lucide x (ISC License, see NOTICE). -->
            <button wicket:id="close" type="button" command="close" class="sw-sheet-close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </form>
    </dialog>
</wicket:panel>
