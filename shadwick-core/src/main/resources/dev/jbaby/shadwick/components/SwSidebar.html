<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div wicket:id="header" class="sw-sidebar-header"></div>
    <div class="sw-sidebar-content">
        <ul wicket:id="menu" class="sw-sidebar-menu">
            <li wicket:id="items" class="sw-sidebar-menu-item">
                <a wicket:id="link" class="sw-sidebar-menu-button"><svg wicket:id="icon"></svg><span wicket:id="label" class="sw-sidebar-menu-button-label"></span></a><span wicket:id="menuBadge" class="sw-sidebar-menu-badge"></span>
                <div wicket:id="group" class="sw-sidebar-group" role="group">
                    <details wicket:id="details" class="sw-sidebar-group-collapsible">
                        <summary class="sw-sidebar-group-label"><svg wicket:id="groupIcon"></svg><span wicket:id="label"></span><svg class="sw-sidebar-group-label-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></summary>
                        <ul class="sw-sidebar-menu"><li wicket:id="groupItems" class="sw-sidebar-menu-item"><a wicket:id="link" class="sw-sidebar-menu-button"><svg wicket:id="icon"></svg><span wicket:id="label" class="sw-sidebar-menu-button-label"></span></a><span wicket:id="menuBadge" class="sw-sidebar-menu-badge"></span></li></ul>
                    </details>
                </div>
            </li>
        </ul>
    </div>
    <div wicket:id="footer" class="sw-sidebar-footer"></div>
    <button wicket:id="close" type="button" popovertargetaction="hide" class="sw-sidebar-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</wicket:panel>
