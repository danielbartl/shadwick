<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <fieldset wicket:id="container" class="sw-field">
        <legend wicket:id="label" class="sw-label sw-field-label"></legend>
        <div wicket:id="input" class="sw-rating-input" role="radiogroup"></div>
        <p wicket:id="description" class="sw-field-description"></p>
        <div wicket:id="error" class="sw-field-error" role="status"></div>
    </fieldset>
</wicket:panel>
