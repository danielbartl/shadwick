<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div wicket:id="container" class="sw-field">
        <label wicket:id="label" class="sw-label sw-field-label"></label>
        <div wicket:id="group" class="sw-input-group" role="group">
            <input wicket:id="input" class="sw-input" />
            <span wicket:id="prefix" class="sw-input-group-addon sw-input-group-text"></span>
            <span wicket:id="suffix" class="sw-input-group-addon sw-input-group-text" data-align="inline-end"></span>
        </div>
        <datalist wicket:id="suggestions"><option wicket:id="option"></option></datalist>
        <p wicket:id="description" class="sw-field-description"></p>
        <div wicket:id="error" class="sw-field-error" role="status"></div>
    </div>
</wicket:panel>
