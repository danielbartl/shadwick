<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div wicket:id="container" class="sw-field">
        <label wicket:id="label" class="sw-label sw-field-label"></label>
        <span wicket:id="selectWrapper">
            <select wicket:id="input" class="sw-select"></select>
            <!-- Lucide chevron-down (ISC, see NOTICE). -->
            <svg class="sw-select-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
        </span>
        <p wicket:id="description" class="sw-field-description"></p>
        <div wicket:id="error" class="sw-field-error" role="status"></div>
    </div>
</wicket:panel>
