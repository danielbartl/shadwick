      <noscript wicket:id="fallback"><span class="sw-step-link"><span wicket:id="number" class="sw-step-number"></span><span class="sw-step-content"><span wicket:id="title" class="sw-step-title"></span><span wicket:id="status" class="sw-step-status"></span></span></span></noscript>
    </li>
  </ol>
</div></wicket:panel>
