<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
    <button wicket:id="trigger" type="button" command="show-modal"><span wicket:id="triggerLabel"></span></button>
    <dialog wicket:id="dialog" class="sw-dialog">
        <form wicket:id="form" class="sw-dialog-form">
            <div class="sw-dialog-header">
                <div wicket:id="title" class="sw-dialog-title" role="heading" aria-level="2"></div>
                <p wicket:id="description" class="sw-dialog-description"></p>
            </div>
            <div wicket:id="content"></div>
            <div wicket:id="footer" class="sw-dialog-footer">
                <button wicket:id="cancel" type="button" command="close"><span wicket:id="cancelLabel"></span></button>
                <button wicket:id="confirm" type="submit"><span wicket:id="confirmLabel"></span></button>
            </div>
            <!-- Lucide's "x" (ISC License, see NOTICE) -->
            <button wicket:id="close" type="button" command="close" class="sw-dialog-close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </form>
    </dialog>
</wicket:panel>
</body>
</html>
