name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'shadwick/**'
      - 'README.md'
      - 'shadwick-core/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'shadwick/**'
      - 'README.md'
      - 'shadwick-core/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # One Maven cache per workflow and job, so each keeps every plugin and dependency it uses. setup-java's single
      # shared cache was saved by whichever job finished first (often one needing fewer plugins) and never refreshed while
      # the POMs stayed the same, so the other jobs fetched the rest from Maven Central on every run, all at once.
      - name: Cache Maven's repository and wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            !~/.m2/repository/dev/jbaby
          key: maven-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('shadwick-core/package-lock.json') }}
      - name: Build and test the library and its CSS
        run: ./mvnw -B -pl shadwick-core -am verify
      - name: Check documentation, API scanner and agent resources
        run: ./shadwick-core/target/node/node --test --test-isolation=none site/docs/*.test.mjs
      - name: Build the static website
        run: ./shadwick-core/target/node/node site/build.mjs
      - name: Check site assets and internal links
        run: ./shadwick-core/target/node/node site/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
