name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # The build installs its own Node (cached with Maven's repository); this keeps npm's downloads
      - name: Cache npm's downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('shadwick-core/package-lock.json') }}

      - name: Check release gates
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build and test
        run: ./mvnw -B -Prelease verify

      - name: Check the release archives
        run: python3 scripts/check-release.py artifacts

  browser:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: showcase-vega, skins: vega}
          - {group: showcase-lyra, skins: lyra}
          - {group: showcase-nova, skins: nova}
          - {group: showcase-maia, skins: maia}
          - {group: showcase-mira, skins: mira}
          - {group: showcase-luma, skins: luma}
          - {group: showcase-rhea, skins: rhea}
          - {group: showcase-sera, skins: sera}
          - {group: showcase-sketch, skins: sketch}
          - {group: components-0, shard: 0}
          - {group: components-1, shard: 1}
          - {group: components-2, shard: 2}
          - {group: components-3, shard: 3}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache npm's downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('shadwick-core/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('shadwick-examples/pom.xml') }}

      - name: Install the library
        run: ./mvnw -B install -DskipTests -pl shadwick-core -am

      - name: Install Chromium, Firefox and their system libraries
        run: ./mvnw -B -pl shadwick-examples exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium firefox" -Dexec.classpathScope=test

      - name: Check narrow German/RTL tooltips first
        if: matrix.group == 'components-0'
        run: ./mvnw -B test -pl shadwick-examples -Pbrowser -Dtest=ChartFormatBrowserTest#germanKeyboardAndTouchKeepTheirFormatsAfterPartialAjaxAndRepeatedInitialization

      - name: Check the showcase in Chromium and Firefox
        env:
          BROWSER_GROUP: ${{ matrix.group }}
          BROWSER_SKINS: ${{ matrix.skins }}
          BROWSER_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [[ "$BROWSER_GROUP" == showcase-* ]]; then
            ./mvnw -B verify -pl shadwick-examples -Pbrowser -Dtest=ShowcaseBrowserTest -Dshadwick.browser.skins="$BROWSER_SKINS"
          else
            browser_tests=$(python3 scripts/browser-shard.py --index "$BROWSER_SHARD")
            ./mvnw -B verify -pl shadwick-examples -Pbrowser -Dtest="$browser_tests"
          fi

      - name: Preserve browser failure reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.group }}
          path: |
            shadwick-examples/target/surefire-reports/**
            shadwick-examples/target/*screenshots/**
