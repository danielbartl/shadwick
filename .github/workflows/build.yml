name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # The build installs its own Node (cached with Maven's repository); this keeps npm's downloads
      - name: Cache npm's downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('shadwick-core/package-lock.json') }}

      - name: Build and test
        run: ./mvnw -B verify

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache npm's downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('shadwick-core/package-lock.json') }}

      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('shadwick-examples/pom.xml') }}

      - name: Install the library
        run: ./mvnw -B install -DskipTests -pl shadwick-core -am

      - name: Install Chromium and its system libraries
        run: ./mvnw -B -pl shadwick-examples exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium" -Dexec.classpathScope=test

      - name: Check the showcase in Chromium
        run: ./mvnw -B verify -pl shadwick-examples -Pbrowser
