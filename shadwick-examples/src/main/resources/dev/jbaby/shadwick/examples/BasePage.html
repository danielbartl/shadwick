<!DOCTYPE html>
<html wicket:id="html" lang="en" xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8">
    <link wicket:id="favicon" rel="icon" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title wicket:id="title">Shadwick</title>
</head>
<body>
<a wicket:id="skip"></a>
<header wicket:id="siteHeader" class="ex-header">
    <a wicket:id="catalogHome" class="ex-brand"><img wicket:id="brandLogo" alt="" width="28" height="28"><span>Shadwick <small>Components</small></span></a>
    <nav aria-label="Project" class="ex-project-nav"><a wicket:id="studioHome">Clover Studio <span aria-hidden="true">↗︎</span></a><a href="https://danielbartl.github.io/shadwick/docs/">Documentation <span aria-hidden="true">↗︎</span></a></nav>
    <details class="ex-preferences"><summary>Appearance &amp; language</summary>
    <div class="ex-switches">
        <div role="group" aria-label="Skin" class="ex-group">
            <a wicket:id="vega">Vega</a>
            <a wicket:id="lyra">Lyra</a>
            <a wicket:id="nova">Nova</a>
            <a wicket:id="maia">Maia</a>
            <a wicket:id="mira">Mira</a>
            <a wicket:id="luma">Luma</a>
            <a wicket:id="rhea">Rhea</a>
            <a wicket:id="sera">Sera</a>
            <a wicket:id="sketch">Sketch</a>
        </div>
        <div wicket:id="modeLinks" role="group" aria-label="Mode" class="ex-group">
            <a wicket:id="light">Light</a>
            <a wicket:id="dark">Dark</a>
        </div>
        <form wicket:id="languageForm" class="ex-group ex-language">
            <label wicket:id="languageLabel" for="showcase-language">Language</label>
            <div class="sw-native-select-wrapper" data-size="sm">
                <select wicket:id="language" class="sw-native-select"></select>
            </div>
            <button wicket:id="applyLanguage" type="submit">Apply</button>
        </form>
    </div>
    </details>
</header>
<div class="ex-catalog-shell">
  <div wicket:id="catalogNavigation"></div>
  <main wicket:id="main" class="ex-main">
    <div class="ex-page-context"><div><span wicket:id="pageGroup"></span><span aria-hidden="true">/</span><strong wicket:id="pageTitle"></strong></div><div><a wicket:id="viewCode" href="#example-source">View Wicket code <span aria-hidden="true">↓</span></a><a wicket:id="pageGuide">Guide <span aria-hidden="true">↗︎</span></a></div></div>
    <wicket:child/>
    <div wicket:id="exampleSource"></div>
    <footer class="ex-catalog-footer"><span>Shadwick · Apache Wicket 10 · Java 17+</span><a href="https://github.com/danielbartl/shadwick">GitHub <span aria-hidden="true">↗︎</span></a></footer>
  </main>
</div>
</body>
</html>
