<wicket:extend xmlns:wicket="http://wicket.apache.org">
<div>
    <h1 class="ex-title">Buttons</h1>
    <p class="ex-lead">shadcn's six variants and four sizes, on <code>&lt;button&gt;</code> and <code>&lt;a&gt;</code>.</p>
</div>

<section class="ex-section" aria-labelledby="buttons-heading">
    <h2 id="buttons-heading">Buttons</h2>
    <p class="ex-muted"><code>SwButton.onClick("save", "Save", target -&gt; ...).setVariant(...)</code></p>
    <div class="ex-row">
        <wicket:container wicket:id="buttons"><button wicket:id="button"></button></wicket:container>
    </div>
    <p wicket:id="status" class="ex-muted" role="status"></p>
</section>

<section class="ex-section" aria-labelledby="links-heading">
    <h2 id="links-heading">Links</h2>
    <p class="ex-muted"><code>anyLink.add(Sw.Behaviors.button(Variant.OUTLINE))</code></p>
    <div class="ex-row">
        <wicket:container wicket:id="links"><a wicket:id="link"></a></wicket:container>
    </div>
</section>

<section class="ex-section" aria-labelledby="sizes-heading">
    <h2 id="sizes-heading">Sizes</h2>
    <p class="ex-muted"><code>.setSize(Size.SMALL)</code>, <code>LARGE</code>, and <code>ICON</code>, which needs an
        <code>aria-label</code>.</p>
    <div class="ex-row">
        <button wicket:id="small"></button>
        <button wicket:id="default"></button>
        <button wicket:id="large"></button>
        <!-- Lucide's "plus" (ISC License) -->
        <button wicket:id="icon" aria-label="Add"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    </div>
</section>

<section class="ex-section" aria-labelledby="disabled-heading">
    <h2 id="disabled-heading">Disabled</h2>
    <div class="ex-row">
        <button wicket:id="disabledButton"></button>
        <a wicket:id="disabledLink"></a>
    </div>
</section>
</wicket:extend>
