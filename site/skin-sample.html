<!doctype html>
<html lang="en" class="palette">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>__SKIN_NAME__ skin sample · Shadwick</title>
  <link rel="stylesheet" href="../assets/shadwick-__SKIN__.css">
  <link rel="stylesheet" href="../assets/palette.css">
  <link rel="stylesheet" href="../assets/skin-sample.css">
  <script src="../assets/skin-sample.js"></script>
</head>
<body data-skin="__SKIN__">
  <!-- A static specimen of the real __SKIN_NAME__ bundle; the landing page labels it. -->
  <main class="sw-card sample-card" inert>
    <div class="sw-card-header">
      <p class="sw-card-title">Weekly digest</p>
      <p class="sw-card-description">Choose what lands in your inbox.</p>
    </div>
    <div class="sw-card-content sample-content">
      <div class="sw-field"><label class="sw-label" for="sample-email">Email address</label><input class="sw-input" id="sample-email" type="email" value="alex@example.com"></div>
      <div class="sample-row">
        <span class="sample-choice"><input class="sw-switch" id="sample-quiet" type="checkbox" role="switch" checked><label class="sw-label" for="sample-quiet">Quiet hours</label></span>
        <span class="sw-badge" data-variant="secondary">Weekly</span>
      </div>
    </div>
    <div class="sw-card-footer sample-footer"><button class="sw-button" data-variant="outline" type="button">Later</button><button class="sw-button" type="button">Subscribe</button></div>
  </main>
</body>
</html>
